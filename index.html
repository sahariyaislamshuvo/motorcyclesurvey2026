<html lang="bn">
<head>

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f3f6;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 1250px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }
        
        /* Company & Header Profile Box */
        .profile-header {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .profile-header h1 {
            margin: 0 0 5px 0;
            font-size: 22px;
            letter-spacing: 0.5px;
        }
        .profile-info {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .info-card {
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 15px;
            border-radius: 6px;
            font-size: 14px;
            backdrop-filter: blur(5px);
        }
        .info-card strong {
            color: #ffd700;
        }

        /* Controls Grid */
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .file-upload-btn {
            position: relative;
            background: #eef2f5;
            padding: 10px 15px;
            border: 2px dashed #3498db;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            color: #2c3e50;
        }
        .file-upload-btn input[type="file"] {
            position: absolute;
            left: 0; top: 0; opacity: 0;
            width: 100%; height: 100%;
            cursor: pointer;
        }
        .select-box, .search-box {
            padding: 12px;
            border: 1px solid #dcdfe6;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            width: 100%;
        }
        .select-box:focus, .search-box:focus {
            border-color: #3498db;
        }

        /* Chart Area */
        .chart-container {
            position: relative;
            height: 320px;
            margin-bottom: 30px;
            background: #fafafa;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #eaeaea;
        }

        /* Table Area */
        .table-responsive {
            overflow-x: auto;
            max-height: 55vh;
            border-radius: 8px;
            border: 1px solid #e1e1e1;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        th {
            background-color: #1e3c72;
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        tr:hover {
            background-color: #f4f8fb;
        }
        .center { text-align: center; }

        /* Status Badges */
        .badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }
        .pending { background-color: #ffebe9; color: #d9381e; }
        .done { background-color: #e6f4ea; color: #137333; }
    </style>
</head>

let chartInstance = null;

function renderDashboard(data) {
    updateTable(data);
    updateChart(data);
}

function updateTable(dataArray) {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    dataArray.forEach((item, index) => {
        const remaining = (item.target || 0) - (item.achieved || 0);
        let statusBadge = remaining > 0 
            ? `<span class="badge pending">বাকি ${remaining} টি</span>` 
            : `<span class="badge done">Done</span>`;

        const row = `
            <tr>
                <td class="center">${index + 1}</td>
                <td><strong>${item.operator || '-'}</strong></td>
                <td>${item.category || '-'}</td>
                <td>${item.maker || '-'}</td>
                <td><strong>${item.model || '-'}</strong></td>
                <td class="center">${item.target || 0}</td>
                <td class="center">${item.achieved || 0}</td>
                <td class="center">${statusBadge}</td>
            </tr>
        `;
        tbody.innerHTML += row;
    });
}

function updateChart(dataArray) {
    const ctx = document.getElementById('analyticsChart').getContext('2d');
    
    const brandMap = {};
    dataArray.forEach(row => {
        const brand = row.maker || 'Other';
        if(!brandMap[brand]) brandMap[brand] = { target: 0, achieved: 0 };
        brandMap[brand].target += Number(row.target || 0);
        brandMap[brand].achieved += Number(row.achieved || 0);
    });

    const labels = Object.keys(brandMap);
    const targetData = labels.map(k => brandMap[k].target);
    const achievedData = labels.map(k => brandMap[k].achieved);

    if (chartInstance) chartInstance.destroy();

    chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [
                { label: 'Dhaka Target', data: targetData, backgroundColor: '#1e3c72' },
                { label: 'Achieved', data: achievedData, backgroundColor: '#2ecc71' }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                title: { display: true, text: 'Maker-wise Performance Analytics' }
            }
        }
    });
}

function applyFilters() {
    const selectedOp = document.getElementById('operatorSelect').value.toUpperCase();
    const searchVal = document.getElementById('searchInput').value.toUpperCase();

    const filtered = masterDataset.filter(item => {
        const matchOp = (selectedOp === 'ALL') || (item.operator && item.operator.toUpperCase() === selectedOp);
        const matchSearch = (item.model && item.model.toUpperCase().includes(searchVal)) ||
                            (item.maker && item.maker.toUpperCase().includes(searchVal)) ||
                            (item.category && item.category.toUpperCase().includes(searchVal));
        return matchOp && matchSearch;
    });

    renderDashboard(filtered);
}

function handleExcelUpload(e) {
    const file = e.target.files[0];
    if (!file) return;

    document.getElementById('fileName').innerText = `📄 ${file.name}`;

    const reader = new FileReader();
    reader.onload = function(evt) {
        const buffer = evt.target.result;
        const wb = XLSX.read(buffer, { type: 'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rawData = XLSX.utils.sheet_to_json(sheet);

        masterDataset = rawData.map(r => ({
            operator: r['Operator'] || r['Name'] || 'Shuvo',
            category: r['CC Category'] || r['Category'] || '',
            maker: r['Maker'] || r['Brand'] || '',
            model: r['Model'] || r['Model Name'] || 'Unknown',
            target: Number(r['Dhaka Target'] || r['Target'] || 0),
            achieved: Number(r['Achieved'] || r['Dhaka Achieved'] || 0)
        }));

        renderDashboard(masterDataset);
    };
    reader.readAsArrayBuffer(file);
}
