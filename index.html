<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dhaka Zone Live Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f3f6;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 1250px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }
        
        /* Header Profile Box */
        .profile-header {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .profile-header h1 {
            margin: 0 0 8px 0;
            font-size: 24px;
        }
        .profile-info-grid {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .info-card {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
        }
        .info-card strong {
            color: #ffd700;
        }

        /* Project Dynamic Inputs Box */
        .meta-inputs {
            background: #eef2f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
        }
        .meta-inputs input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        /* Filter Controls */
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .select-box, .search-box {
            padding: 12px;
            border: 1px solid #dcdfe6;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            width: 100%;
        }
        .select-box:focus, .search-box:focus {
            border-color: #3498db;
        }

        /* Table Area */
        .table-responsive {
            overflow-x: auto;
            max-height: 60vh;
            border-radius: 8px;
            border: 1px solid #e1e1e1;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        th {
            background-color: #1e3c72;
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        tr:hover {
            background-color: #f4f8fb;
        }
        .center { text-align: center; }

        /* Status Badges */
        .badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }
        .pending { background-color: #ffebe9; color: #d9381e; }
        .done { background-color: #e6f4ea; color: #137333; }
    </style>
</head>

            </thead>
            <tbody id="tableBody">

        </table>
    </div>
</div>

function updateHeader() {
    const comp = document.getElementById('inCompany').value;
    const proj = document.getElementById('inProject').value;
    const sup = document.getElementById('inSupervisor').value;
    const op = document.getElementById('inOperator').value;

    document.getElementById('dispCompany').innerText = comp ? '🏢 ' + comp : '🏢 [কোম্পানির নাম লিখুন]';
    document.getElementById('dispProject').innerText = proj ? proj : 'Dhaka Zone Target Progress';
    document.getElementById('dispSupervisor').innerText = sup ? sup : 'Not Assigned';
    document.getElementById('dispOperator').innerText = op ? op : 'Sahariya Islam Shuvo';
}

function updateTable(dataArray) {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    dataArray.forEach((item, index) => {
        const remaining = (item.target || 0) - (item.achieved || 0);
        let statusBadge = remaining > 0 
            ? `<span class="badge pending">বাকি ${remaining} টি</span>` 
            : `<span class="badge done">Done</span>`;

        const row = `
            <tr>
                <td class="center">${index + 1}</td>
                <td><strong>${item.operator || '-'}</strong></td>
                <td>${item.category || '-'}</td>
                <td>${item.maker || '-'}</td>
                <td><strong>${item.model || '-'}</strong></td>
                <td class="center">${item.target || 0}</td>
                <td class="center">${item.achieved || 0}</td>
                <td class="center">${statusBadge}</td>
            </tr>
        `;
        tbody.innerHTML += row;
    });
}

function applyFilters() {
    const selectedOp = document.getElementById('operatorSelect').value.toUpperCase();
    const searchVal = document.getElementById('searchInput').value.toUpperCase();

    const filtered = masterDataset.filter(item => {
        const matchOp = (selectedOp === 'ALL') || (item.operator && item.operator.toUpperCase() === selectedOp);
        const matchSearch = (item.model && item.model.toUpperCase().includes(searchVal)) ||
                            (item.maker && item.maker.toUpperCase().includes(searchVal)) ||
                            (item.category && item.category.toUpperCase().includes(searchVal));
        return matchOp && matchSearch;
    });

    updateTable(filtered);
}
