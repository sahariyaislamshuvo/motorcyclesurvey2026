<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motorcycle Survey - Clean 104 Bike Segment</title>
    <!-- SheetJS Library for Excel Export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #121212; color: #e0e0e0; padding: 15px; margin: 0; }
        .container { max-width: 1100px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        
        /* Header Section */
        .header-box {
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            color: #fff;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .header-box h1 { margin: 0 0 5px 0; font-size: 20px; color: #00d2ff; }
        .info-grid { display: flex; flex-wrap: wrap; gap: 10px; font-size: 13px; }
        .info-card { background: rgba(0, 0, 0, 0.3); padding: 6px 12px; border-radius: 6px; }

        /* KPI Performance Counters */
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .kpi-card { padding: 12px; border-radius: 8px; text-align: center; color: white; }
        .kpi-target { background: #2980b9; }
        .kpi-done { background: #27ae60; }
        .kpi-pending { background: #c0392b; }
        .kpi-card h3 { margin: 0; font-size: 12px; text-transform: uppercase; opacity: 0.8; }
        .kpi-card h2 { margin: 5px 0 0 0; font-size: 24px; }

        /* Controls Area */
        .controls-section {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }
        .filter-group { flex: 1; min-width: 250px; }
        .filter-label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 6px; color: #00d2ff; }
        
        select.operator-select {
            width: 100%;
            padding: 12px 15px;
            background-color: #2c2c2e;
            color: #ffffff;
            border: 1px solid #444;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            cursor: pointer;
        }

        .search-input {
            flex: 1;
            min-width: 200px;
            padding: 12px 15px;
            background-color: #2c2c2e;
            color: #fff;
            border: 1px solid #444;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        /* Dedicated Excel Download Button */
        .btn-excel {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(56, 239, 125, 0.2);
        }
        .btn-excel:hover { opacity: 0.9; transform: translateY(-1px); }

        /* Table Design */
        .table-responsive { overflow-x: auto; max-height: 55vh; border: 1px solid #333; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
        th { background-color: #333; color: #00d2ff; padding: 12px; position: sticky; top: 0; z-index: 10; }
        td { padding: 10px 12px; border-bottom: 1px solid #2a2a2a; }
        tr:nth-child(even) { background-color: #242424; }
        tr:hover { background-color: #2c3e50; }
        
        .badge { padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; text-align: center; display: inline-block; }
        .badge-pending { background: #4a1515; color: #ff6b6b; }
        .badge-done { background: #0f381e; color: #51cf66; }
        .text-center { text-align: center; }
    </style>
</head>

        </div>

        <input type="text" id="searchInput" class="search-input" placeholder="মডেল বা ব্র্যান্ড সার্চ করুন..." onkeyup="filterData()">
        
        <!-- Click Button for Excel Export -->
        <button class="btn-excel" onclick="exportToExcel()">📥 Download Excel (.xlsx)</button>
    </div>

    <!-- 104 Motorcycle Segment Data Table (No Operator Column) -->
    <div class="table-responsive">

                    <th>Model Name</th>
                    <th class="text-center">Target</th>
                    <th class="text-center">Achieved</th>
                    <th class="text-center">Remaining</th>
                    <th class="text-center">Status</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- JS Data Injection -->
            </tbody>
        </table>
    </div>
</div>

let activeData = [...surveyDataset];

function renderDashboard(data) {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    let tTarget = 0, tAchieved = 0, tRemaining = 0;

    data.forEach((item, index) => {
        const rem = item.target - item.achieved;
        const actualRem = rem > 0 ? rem : 0;

        tTarget += item.target;
        tAchieved += item.achieved;
        tRemaining += actualRem;

        let badge = rem <= 0 
            ? `<span class="badge badge-done">Completed</span>`
            : `<span class="badge badge-pending">বাকি ${rem} টি</span>`;

        tbody.innerHTML += `
            <tr>
                <td class="text-center">${index + 1}</td>
                <td>${item.category}</td>
                <td>${item.maker}</td>
                <td><strong>${item.model}</strong></td>
                <td class="text-center">${item.target}</td>
                <td class="text-center" style="color: #2ecc71; font-weight: bold;">${item.achieved}</td>
                <td class="text-center" style="color: #e74c3c; font-weight: bold;">${actualRem}</td>
                <td class="text-center">${badge}</td>
            </tr>
        `;
    });

    // Update Counters
    document.getElementById('totalTarget').innerText = tTarget;
    document.getElementById('totalAchieved').innerText = tAchieved;
    document.getElementById('totalRemaining').innerText = tRemaining;
}

function filterData() {
    const searchVal = document.getElementById('searchInput').value.toUpperCase();

    activeData = surveyDataset.filter(item => {
        return item.model.toUpperCase().includes(searchVal) || 
               item.maker.toUpperCase().includes(searchVal) ||
               item.category.toUpperCase().includes(searchVal);
    });

    renderDashboard(activeData);
}

// Function to Download Excel Sheet
function exportToExcel() {
    const selectedOp = document.getElementById('operatorSelect').value;
    const fileName = selectedOp === 'All' 
        ? 'Motorcycle_Survey_104_Segment_Report.xlsx' 
        : `Motorcycle_Survey_${selectedOp}_Report.xlsx`;

    const excelRows = activeData.map((item, idx) => ({
        "SL": idx + 1,
        "Operator Selected": selectedOp,
        "CC Category": item.category,
        "Maker": item.maker,
        "Model Name": item.model,
        "Target": item.target,
        "Achieved": item.achieved,
        "Remaining": item.target - item.achieved > 0 ? item.target - item.achieved : 0,
        "Status": (item.target - item.achieved) <= 0 ? "Completed" : "Pending"
    }));

    const worksheet = XLSX.utils.json_to_sheet(excelRows);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "Survey Data");

    XLSX.writeFile(workbook, fileName);
}

// Initial Load
renderDashboard(surveyDataset);
